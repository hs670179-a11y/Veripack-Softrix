<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="VeriPack">
  <title>VeriPack</title>
  <!--
    The mark is drawn on its own light plate on purpose. Both uses are on coloured grounds — the header
    is deep navy, the printed report is white — and the brand's olive and terracotta lines disappear on
    navy. A plate inside the file means one asset that works everywhere, instead of a dark variant that a
    future edit forgets to reference.
  -->
  <rect x="2" y="2" width="92" height="92" rx="17" fill="#F7F5EF" stroke="#5B6A3A" stroke-opacity=".22" stroke-width="1.5" />
  <g transform="translate(48 48.5) scale(0.8) translate(-48 -47)">
    <g fill="none" stroke="#5B6A3A" stroke-linejoin="round" stroke-linecap="round">
      <path stroke-width="5.2" d="M44.5 9.5C53 11.5 60.8 14 67.5 17V44.5c0 16.4-9.6 29-23 39-13.4-10-23-22.6-23-39V17c6.7-3 14.5-5.5 23-7.5Z" />
      <path stroke-width="7.4" d="M28.5 46.5 40 58 70 32" />
    </g>
    <path d="M67.6 29.2 72.4 34.8 92 12.9Z" fill="#5B6A3A" />
    <g fill="none" stroke="#BE6A48" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M44.5 15.5 55.5 21 44.5 26.5 33.5 21Z" />
      <path d="M33.5 21v11l11 5.5V26.5" />
      <path d="M55.5 21v11l-11 5.5" />
      <path d="M39 18.2 50 23.7" />
    </g>
  </g>
</svg>
