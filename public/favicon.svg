<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="VeriPack">
  <title>VeriPack</title>
  <!--
    The favicon is a deliberate simplification, not a shrunk copy of public/logo.svg. At 16 px the
    carton is a smudge and a thin shield outline disappears, so what survives is the recognisable
    gesture — shield plus verification tick — drawn solid, with the tick knocked out of it in the page
    colour. Verified by rendering at 16 / 32 / 48 px.
  -->
  <rect x="2" y="2" width="92" height="92" rx="22" fill="#F7F5EF" />
  <g transform="translate(48 48.5) scale(1.02) translate(-48 -47)">
    <path
      d="M44.5 6C54 8.2 62.5 11 70 14.3V45c0 17.6-10.4 31.2-25.5 42C29.4 76.2 19 62.6 19 45V14.3C26.5 11 35 8.2 44.5 6Z"
      fill="#4E5C31"
    />
    <path d="M30 45.5 42 58 63 34" fill="none" stroke="#F7F5EF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
